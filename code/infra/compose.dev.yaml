services:
  postgres:
    ports: ["5432:5432"]
  redis:
    ports: ["6379:6379"]
  odoo:
    ports: ["8069:8069"]
    command: ["odoo", "--dev=reload,qweb,xml"]
    environment:
      # Adresses qui désignent un fournisseur réel ou son simulateur (D43 retournée,
      # amoa/questions/REPONSES-2026-09-06.md §2). Elles n'ont plus de valeur par défaut dans
      # infra/env/.env.example : c'est ICI qu'elles sont posées, explicitement, pour le
      # développement -- vers les simulateurs (L0-08) et vers mailpit (SMTP de test).
      # infra/compose.yaml les passe sans défaut ; en production, la plateforme d'hébergement
      # les injecte vers les vrais fournisseurs. Non configurées, on échoue bruyamment.
      #
      # D75 : GOOGLE_JWKS_URL n'est plus figée ici sur le mock -- elle vaut le mock par défaut
      # (`make up` fonctionne sans aucun compte externe, D19), mais infra/env/.env peut la
      # remplacer par la vraie adresse Google pour une démonstration, sans jamais toucher ce
      # fichier suivi. GOOGLE_JWKS_URL_MOCK, elle, reste fixée ici : le simulateur n'a qu'une
      # seule adresse possible dans ce compose, il n'y a rien à choisir -- c'est elle qui permet
      # aux chauffeurs simulés de continuer à s'authentifier pendant qu'une vraie connexion
      # Google est en cours à côté.
      GOOGLE_JWKS_URL: ${GOOGLE_JWKS_URL:-http://mock-google-identity:4000/.well-known/jwks.json}
      GOOGLE_JWKS_URL_MOCK: http://mock-google-identity:4000/.well-known/jwks.json
      GOOGLE_ROUTING_URL: http://mock-maps:4001/route
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # D64 : le point d'entrée public du stockage, pour signer les URL destinées à un
      # navigateur. En développement c'est le port MinIO déjà publié à l'hôte par le service
      # minio ci-dessous (9000:9000) -- aucun proxy Caddy nécessaire pour la signature elle-même,
      # même mécanisme que BABANA_MAPS_SEARCH_URL vers mock-maps.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
  realtime:
    ports: ["3000:3000"]
    volumes:
      - ../services/realtime/src:/app/services/realtime/src
      - ../packages/contracts:/app/packages/contracts
    command: ["npm", "run", "dev", "-w", "@babana/realtime"]
  minio:
    ports: ["9000:9000", "9001:9001"]

  # SMTP de test — développement uniquement (L0-06/L0-01R). En production, SMTP_HOST/PORT/
  # USER/PASSWORD pointent vers un relais SMTP réel injecté par la plateforme d'hébergement ;
  # même mécanisme que GOOGLE_JWKS_URL pour mock-google-identity (D19) : le code Odoo qui
  # envoie l'email est identique dans les deux cas, seule l'adresse change.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports: ["8025:8025"]

  # Services simulés — développement uniquement (D19, L0-08)
  mock-google-identity:
    build:
      context: ..
      dockerfile: services/mocks/google-identity/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    ports: ["4000:4000"]
  mock-maps:
    build:
      context: ..
      dockerfile: services/mocks/maps/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    ports: ["4001:4001"]
