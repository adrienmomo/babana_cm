name: babana

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    build:
      context: ../services/odoo
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS}
      # D43 retournée (amoa/questions/REPONSES-2026-09-06.md §2) : ces adresses désignent un
      # fournisseur réel ou son simulateur -- elles n'ont PAS de valeur par défaut ici. Vides
      # dans infra/env/.env.example, posées explicitement pour le développement par
      # infra/compose.dev.yaml (mock-*), fournies par la plateforme d'hébergement en production.
      # Non configurées : le code d'Odoo échoue bruyamment (google_identity.py::_jwks_url,
      # routing.py::_routing_url) et deploy.sh refuse de partir. Plus de garde `:?`/`:-` ici :
      # elle empêcherait `make up` (compose.yaml + compose.dev.yaml) de démarrer alors que la
      # valeur de dev vit désormais dans compose.dev.yaml.
      GOOGLE_JWKS_URL: ${GOOGLE_JWKS_URL}
      GOOGLE_ROUTING_URL: ${GOOGLE_ROUTING_URL}
      # Secret ordinaire (constat du 11 septembre -- amoa/questions/REPONSES-2026-09-11.md §1),
      # posée dans infra/env/.env comme POSTGRES_PASSWORD/JWT_SECRET ci-dessous -- lue aussi bien
      # par ce conteneur que par des outils hôte (test/concurrency/helpers/odoo-session.ts).
      # __init__.py::_post_init_admin_password lève à l'installation du module si elle est vide.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REALTIME_INTERNAL_URL: http://realtime:3000
      REALTIME_SHARED_SECRET: ${REALTIME_SHARED_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: babana-documents
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # D64 (amoa/01-architecture.md §9 octies) : adresse de fournisseur externe au sens de D43,
      # comme GOOGLE_JWKS_URL ci-dessus -- sans valeur par défaut ici. infra/compose.dev.yaml la
      # pose vers le port MinIO déjà publié à l'hôte ; deploy.sh refuse de partir si elle est
      # vide ou pointe vers un nom de service interne. Consommée par services/storage.py pour
      # signer, jamais pour écrire (S3_ENDPOINT ci-dessus reste l'adresse d'écriture).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      # Notification push (L7-01) : 'console' par défaut journalise au lieu d'envoyer (D19) ;
      # 'fcm' exige FCM_PROJECT_ID/FCM_CLIENT_EMAIL/FCM_PRIVATE_KEY, sans repli (D43).
      PUSH_PROVIDER: ${PUSH_PROVIDER:-console}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
    volumes:
      - ../services/odoo/addons:/mnt/extra-addons
      - ../services/odoo/config/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-filestore:/var/lib/odoo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health || exit 1"]
      interval: 10s
      retries: 20
    restart: unless-stopped

  realtime:
    build:
      context: ..
      dockerfile: services/realtime/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      odoo:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      ODOO_INTERNAL_URL: http://odoo:8069
      REALTIME_SHARED_SECRET: ${REALTIME_SHARED_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - odoo
      - realtime
    environment:
      BABANA_DOMAIN: ${BABANA_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-0.0.0.0/0}
      WEB_ALLOWED_IPS: ${WEB_ALLOWED_IPS:-0.0.0.0/0}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/wellknown:/srv/wellknown:ro
      # Bundle web de l'application Client (D46, L6-18), servi sous la même origine que l'API.
      # Construit sur l'hôte par `make client-web` (npm run build:web -w @babana/client) ;
      # répertoire vide -> Caddy rend 404 jusqu'à la première construction.
      - ../apps/client/dist-web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
      - ./minio/bootstrap.sh:/bootstrap.sh:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  odoo-filestore:
  miniodata:
  caddy-data:
  caddy-config:
