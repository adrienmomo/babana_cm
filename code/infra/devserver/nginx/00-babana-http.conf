# Dev server 75.119.155.162 -- port 80: ACME challenges and redirect to HTTPS.
# Enabled first, alone: certbot needs it to obtain the certificate that 10-babana-https.conf uses.
#   sudo ln -sf /var/www/babana_cm/code/infra/devserver/nginx/00-babana-http.conf /etc/nginx/sites-enabled/
#
# Port 80 stays open for good: certificate renewal goes through it (§9 -- closing it is the classic
# cause of a silent expiry three months later).

# Any other name, or a bare IP: close the connection without an answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.babana.dev admin.babana.dev storage.babana.dev share.babana.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
