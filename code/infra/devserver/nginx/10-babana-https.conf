# Dev server 75.119.155.162 -- the four HTTPS hosts. Same routing as infra/caddy/Caddyfile,
# without the web bundle (mobile apps only) and with the trip-share page on its own subdomain
# (the apex babana.dev lives on another machine).
#   sudo ln -sf /var/www/babana_cm/code/infra/devserver/nginx/10-babana-https.conf /etc/nginx/sites-enabled/
#
# Two details break everything if missed: no trailing slash on proxy_pass (the /api, /rt and /s
# prefixes must reach the services intact), and the Upgrade headers on /rt/ (WebSocket).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream babana_odoo     { server 127.0.0.1:8069; keepalive 16; }
upstream babana_odoo_ws  { server 127.0.0.1:8072; }
upstream babana_realtime { server 127.0.0.1:3000; }
upstream babana_storage  { server 127.0.0.1:9000; }

# Unknown names over TLS: refuse the handshake rather than show another host's certificate.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# --- api. : the mobile apps (REST + realtime WebSocket) ------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.babana.dev;
    include /var/www/babana_cm/code/infra/devserver/nginx/babana-tls.inc;

    client_max_body_size 32m;   # driver documents at onboarding

    location /rt/ {
        proxy_pass http://babana_realtime;
        include /var/www/babana_cm/code/infra/devserver/nginx/babana-proxy.inc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # a ride lasts longer than nginx's default 60 s
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://babana_odoo;
        include /var/www/babana_cm/code/infra/devserver/nginx/babana-proxy.inc;
    }
}

# --- admin. : back-office ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.babana.dev;
    include /var/www/babana_cm/code/infra/devserver/nginx/babana-tls.inc;

    client_max_body_size 32m;   # document uploads from the back-office
    proxy_read_timeout 240s;    # = limit_time_real in odoo.conf

    # Odoo's bus (workers > 0 serves it on the gevent port).
    location /websocket {
        proxy_pass http://babana_odoo_ws;
        include /var/www/babana_cm/code/infra/devserver/nginx/babana-proxy.inc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://babana_odoo;
        include /var/www/babana_cm/code/infra/devserver/nginx/babana-proxy.inc;
    }
}

# --- storage. : MinIO's S3 API, NEVER the console (D64) -------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name storage.babana.dev;
    include /var/www/babana_cm/code/infra/devserver/nginx/babana-tls.inc;

    client_max_body_size 32m;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        # MinIO checks the signature against the Host header: it must stay storage.babana.dev,
        # matching S3_PUBLIC_ENDPOINT exactly.
        proxy_pass http://babana_storage;
        include /var/www/babana_cm/code/infra/devserver/nginx/babana-proxy.inc;
    }
}

# --- share. : trip-share page sent by SMS -------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name share.babana.dev;
    include /var/www/babana_cm/code/infra/devserver/nginx/babana-tls.inc;

    location /s/ {
        proxy_pass http://babana_realtime;
        include /var/www/babana_cm/code/infra/devserver/nginx/babana-proxy.inc;
    }

    location / {
        return 404;
    }
}
