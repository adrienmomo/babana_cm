; Dev server 75.119.155.162 -- Odoo 18 from source (/opt/odoo/18.0), run by systemd
; (infra/devserver/systemd/babana-odoo.service). Not read by `make up`, which keeps
; services/odoo/config/odoo.conf.
;
; No secret here: this file is tracked. The database connection comes from the libpq variables
; PGHOST/PGPORT/PGUSER/PGPASSWORD in /etc/babana/babana.env -- Odoo leaves host, port, user and
; password to libpq when db_* are unset, as the Docker image's entrypoint does with HOST/USER/
; PASSWORD.
[options]
addons_path = /var/www/babana_cm/code/services/odoo/addons,/opt/odoo/18.0/addons,/opt/odoo/18.0/odoo/addons
data_dir = /var/lib/babana/odoo
db_name = babana
dbfilter = ^babana$
list_db = False
proxy_mode = True
; D53: never Odoo's demo data (see services/odoo/config/odoo.conf).
without_demo = all

; Behind nginx only.
http_interface = 127.0.0.1
http_port = 8069
gevent_port = 8072

; 4 vCPU / 8 GB: two HTTP workers, one cron thread. The local image runs workers = 0.
workers = 2
max_cron_threads = 1
limit_memory_soft = 1073741824
limit_memory_hard = 1610612736
limit_time_cpu = 120
limit_time_real = 240

; Logs go to journald (journalctl -u babana-odoo).
logfile = False
