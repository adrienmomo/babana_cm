[options]
; db_host, db_user, db_password ne sont volontairement pas ici : l'entrypoint de l'image
; officielle odoo:18 les injecte depuis les variables d'environnement HOST/USER/PASSWORD
; (voir infra/compose.yaml), lues elles-mêmes depuis infra/env/.env (L0-06). Les fixer ici
; dupliquerait la source de vérité et pourrait la contredire silencieusement.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
db_name = babana
list_db = False
proxy_mode = True
logfile = False
workers = 0

; D53 (amoa/01-architecture.md §7) : la base n'installe JAMAIS les données de démonstration
; d'Odoo. Deux raisons. 1. Elles créent des écritures comptables dès l'installation du module
; `account`, et Odoo refuse ensuite de changer la devise d'une société qui possède des
; écritures -- le compte courant des chauffeurs et le grand livre se retrouvaient libellés en
; dollars pendant que l'API annonce « XAF ». 2. Un superviseur qui ouvre le back-office n'a
; rien à faire avec des clients, des factures et des employés fictifs. `without_demo` est lu à
; la création de la base (premier accès HTTP qui initialise `db_name`) comme à chaque `-i` :
; c'est le seul endroit qui couvre les deux chemins d'un coup. Le pendant côté module :
; babana charge lui-même le plan comptable générique (post_init_hook, __init__.py) puisque
; c'était la donnée de démonstration `account` qui l'apportait jusqu'ici.
without_demo = all

; admin_passwd (mot de passe maître, écrans /web/database/manager) est volontairement absent :
; c'est un secret, et ce fichier est suivi par git (invariant 5, "aucun secret dans le dépôt,
; jamais"). Odoo tombe sur une valeur par défaut non fonctionnelle en son absence, ce qui
; désactive de fait les écrans de gestion de base -- acceptable tant que list_db reste False.
; Si ces écrans doivent être ouverts un jour, la valeur doit venir d'une variable d'environnement
; injectée au démarrage (L0-06), jamais de ce fichier.

